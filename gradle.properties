# Gradle
org.gradle.jvmargs=-Xmx2048m

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Continue the previously installed upstream development version convention.
jellyfin.version=0.0.0-dev.2
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
